name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node install.mjs --help

  readout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: readout
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: readout/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile assets/example.mdx --out /tmp/readout-example.html
